<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ project['name'] }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 40px; padding-bottom: 40px; }
        .project-container {
            max-width: 800px;
            margin: auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .project-title { color: #008000; font-weight: bold; margin-bottom: 30px;}
        h3 { color: #333; font-size: 1.5rem; margin-top: 30px; border-bottom: 2px solid #eee; padding-bottom: 5px; }
        p { font-size: 1.1rem; line-height: 1.8; color: #555; }
        .project-image { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="project-container">
    <h1 class="project-title">{{ project['name'] }}</h1>
    
    <!-- Eğer veritabanında BLOB fotoğraf varsa burada gösterecek -->
    {% if photo_base64 %}
        <img src="data:image/jpeg;base64,{{ photo_base64 }}" alt="Proje Fotoğrafı" class="project-image">
    {% endif %}

    <h3>What?</h3>
    <p>{{ project['what'] }}</p>

    <h3>Why?</h3>
    <p>{{ project['why'] }}</p>

    <h3>Result:</h3>
    <p>{{ project['result'] }}</p>

    <h3>Key Technologies:</h3>
    <p>{{ project['key_tech'] }}</p>

    <div class="mt-5">
        <a href="{{ url_for('portfolio') }}" class="btn btn-outline-dark">&larr; Portfolyoya Geri Dön</a>
    </div>
</div>

</body>
</html>
